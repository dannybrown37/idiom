<div class="tabs">
  <div class="tab-list" role="tablist" aria-label="Show details">
    <button
      class="tab"
      id="tab-overview"
      type="button"
      role="tab"
      aria-selected="true"
      aria-controls="tabpanel-overview"
    >
      Overview
    </button>
    <button
      class="tab"
      id="tab-prices"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="tabpanel-prices"
      tabindex="-1"
    >
      Prices
    </button>
    <button
      class="tab"
      id="tab-history"
      type="button"
      role="tab"
      aria-selected="false"
      aria-controls="tabpanel-history"
      tabindex="-1"
    >
      History
    </button>
  </div>
  <div class="tab-panel" id="tabpanel-overview" role="tabpanel" aria-labelledby="tab-overview">
    Running time 2h 45m, one intermission.
  </div>
  <div class="tab-panel" id="tabpanel-prices" role="tabpanel" aria-labelledby="tab-prices" hidden>
    Lowest tonight: $89.50 in the rear mezzanine.
  </div>
  <div class="tab-panel" id="tabpanel-history" role="tabpanel" aria-labelledby="tab-history" hidden>
    Opened April 2019. 2,000 performances and counting.
  </div>
</div>
