<fieldset class="btn-group" aria-label="Text alignment" data-exclusive>
  <button class="btn" type="button" aria-pressed="true">Left</button>
  <button class="btn" type="button" aria-pressed="false">Center</button>
  <button class="btn" type="button" aria-pressed="false">Right</button>
</fieldset>
<fieldset class="btn-group" aria-label="Formatting">
  <button class="btn" type="button" aria-pressed="true" aria-label="Bold"><b>B</b></button>
  <button class="btn" type="button" aria-pressed="false" aria-label="Italic"><i>I</i></button>
  <button class="btn" type="button" aria-pressed="false" aria-label="Underline"><u>U</u></button>
</fieldset>
