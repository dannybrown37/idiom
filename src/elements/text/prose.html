<div class="prose">
  <h3>Exporting a song</h3>
  <p>
    Songs save as XML in the <code>SONGS</code> folder. Each file carries its
    own tempo and key, so the stats page can sort by either.
  </p>
  <ul>
    <li>Kits and synths are stored by reference.</li>
    <li>Samples stay where they are on the card.</li>
  </ul>
  <blockquote>
    Renaming a sample folder breaks every song that points into it.
  </blockquote>
</div>
