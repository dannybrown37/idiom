<div class="field">
  <label class="field-label" for="tf-name">Display name</label>
  <input class="input" id="tf-name" type="text" value="Danny" autocomplete="off" />
</div>
<div class="field">
  <label class="field-label" for="tf-email">Email</label>
  <input
    class="input"
    id="tf-email"
    type="email"
    placeholder="you@example.com"
    aria-describedby="tf-email-hint"
  />
  <p class="field-hint" id="tf-email-hint">Only used for receipts.</p>
</div>
<div class="field">
  <label class="field-label" for="tf-slug">URL slug</label>
  <input
    class="input"
    id="tf-slug"
    type="text"
    value="My Post!"
    aria-invalid="true"
    aria-describedby="tf-slug-error"
  />
  <p class="field-error" id="tf-slug-error">
    Lowercase letters, numbers and hyphens only.
  </p>
</div>
